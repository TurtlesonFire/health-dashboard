name: Deploy to GitHub Pages

# Runs only on `main`, and only after verify.yml has passed on that exact
# commit. The site deployed is the artifact verify.yml built and tested — this
# job does not rebuild, so it cannot deploy bytes that were never verified.
#
# Release flow:
#   git checkout testing && git push origin testing     -> verify.yml runs
#   gh pr create --base main --head testing             -> verify.yml runs (required)
#   merge                                               -> this workflow deploys

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
